<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>แฟลชการ์ด Oxford 3000</title>
  <!-- ฟอนต์จาก Google Fonts (เปลี่ยนฟอนต์: แก้ชื่อในลิงก์นี้ และ --font ใน style.css) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <!-- ใส่โหมดสว่าง/มืดที่เคยเลือกไว้ก่อนหน้าเว็บแสดง จะได้ไม่กะพริบ -->
  <script>
    try {
      var t = localStorage.getItem("flashcard-theme");
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <!-- ===== หน้ารอโหลด: แสดงระหว่างเช็กว่าล็อกอินอยู่หรือไม่ ===== -->
  <div id="loadingScreen" class="loading-screen">กำลังโหลด...</div>

  <!-- ===== หน้าเข้าสู่ระบบ / สมัครสมาชิก (แสดงเมื่อยังไม่ล็อกอิน) ===== -->
  <section id="authScreen" class="auth-screen hidden">
    <button type="button" class="btn small theme-btn" aria-label="สลับโหมดสว่าง/มืด">🌙</button>
    <h1 class="auth-title">แฟลชการ์ด Oxford 3000</h1>

    <!-- หน้าเข้าสู่ระบบ -->
    <form id="loginView" class="auth-box" novalidate>
      <h2>เข้าสู่ระบบ</h2>
      <label>อีเมล
        <input id="loginEmail" type="email" placeholder="you@example.com" autocomplete="email">
      </label>
      <label>รหัสผ่าน
        <input id="loginPassword" type="password" placeholder="รหัสผ่าน" autocomplete="current-password">
      </label>
      <button type="submit" class="btn primary full">เข้าสู่ระบบ</button>
      <button type="button" id="resetBtn" class="link-btn">ลืมรหัสผ่าน?</button>
      <div class="divider">หรือ</div>
      <button type="button" class="btn full google-btn">เข้าสู่ระบบด้วย Google</button>
      <p class="auth-message" id="loginMessage"></p>
      <p class="switch">ยังไม่มีบัญชี? <button type="button" class="link-btn" id="toRegister">สมัครสมาชิก</button></p>
    </form>

    <!-- หน้าสมัครสมาชิก -->
    <form id="registerView" class="auth-box hidden" novalidate>
      <h2>สมัครสมาชิก</h2>
      <label>อีเมล
        <input id="registerEmail" type="email" placeholder="you@example.com" autocomplete="email">
      </label>
      <label>ตั้งรหัสผ่าน (อย่างน้อย 6 ตัว)
        <input id="registerPassword" type="password" placeholder="รหัสผ่านใหม่" autocomplete="new-password">
      </label>
      <label>ยืนยันรหัสผ่าน
        <input id="registerConfirm" type="password" placeholder="พิมพ์รหัสผ่านอีกครั้ง" autocomplete="new-password">
      </label>
      <button type="submit" class="btn primary full">สมัครสมาชิก</button>
      <div class="divider">หรือ</div>
      <button type="button" class="btn full google-btn">สมัครด้วย Google</button>
      <p class="auth-message" id="registerMessage"></p>
      <p class="switch">มีบัญชีอยู่แล้ว? <button type="button" class="link-btn" id="toLogin">เข้าสู่ระบบ</button></p>
    </form>
  </section>

  <!-- ===== หน้าเล่นแฟลชการ์ด (แสดงเมื่อล็อกอินแล้ว) ===== -->
  <div id="appScreen" class="hidden">
  <header class="topbar">
    <h1>แฟลชการ์ด Oxford 3000</h1>
    <div class="account">
      <span id="userLabel" class="user-label"></span>
      <button type="button" class="btn small theme-btn" aria-label="สลับโหมดสว่าง/มืด">🌙</button>
      <button id="logoutBtn" class="btn small">ออกจากระบบ</button>
    </div>
  </header>

  <main class="container">
    <!-- ===== ปุ่มเลือกระดับ ===== -->
    <section class="levels" id="levelButtons">
      <button class="level-btn active" data-level="ALL">ทั้งหมด</button>
      <button class="level-btn" data-level="A1">A1</button>
      <button class="level-btn" data-level="A2">A2</button>
      <button class="level-btn" data-level="B1">B1</button>
      <button class="level-btn" data-level="B2">B2</button>
    </section>

    <!-- ===== ตัวเลือกอื่นๆ ===== -->
    <section class="options">
      <label class="check">
        <input type="checkbox" id="onlyUnknown"> แสดงเฉพาะคำที่ยังไม่จำ
      </label>
      <button id="shuffleBtn" class="btn small">🔀 สุ่มลำดับ</button>
      <label>สำเนียง
        <select id="accentSelect">
          <option value="en-US">อเมริกัน (en-US)</option>
          <option value="en-GB">อังกฤษ (en-GB)</option>
        </select>
      </label>
      <label>ความเร็ว
        <select id="speedSelect">
          <option value="1">ปกติ</option>
          <option value="0.6">ช้า</option>
        </select>
      </label>
    </section>
    <p id="voiceNotice" class="notice hidden"></p>

    <!-- ===== การ์ด (คลิกเพื่อพลิก) ===== -->
    <section class="card-area">
      <p id="counter" class="counter"></p>
      <div id="card" class="card" tabindex="0" aria-label="แฟลชการ์ด คลิกเพื่อพลิก">
        <div class="card-inner">
          <div class="card-face card-front">
            <span id="levelTag" class="level-tag"></span>
            <span id="statusTag" class="status-tag"></span>
            <h2 id="wordText" class="word"></h2>
            <p id="posText" class="pos"></p>
            <button id="speakWordBtn" class="btn speak">🔊 ฟังคำศัพท์</button>
            <p class="hint">แตะการ์ดเพื่อดูความหมาย</p>
          </div>
          <div class="card-face card-back">
            <p id="meaningText" class="meaning"></p>
            <p id="exampleText" class="example"></p>
            <p id="exampleThText" class="example-th"></p>
            <button id="speakExampleBtn" class="btn speak">🔊 ฟังประโยคตัวอย่าง</button>
          </div>
        </div>
      </div>
      <p id="emptyMessage" class="empty hidden">ไม่มีคำในตัวกรองนี้ 🎉 ลองเปลี่ยนระดับหรือปิดตัวกรอง</p>

      <!-- ===== ปุ่มจำได้/ยังไม่จำ และปุ่มเลื่อนการ์ด ===== -->
      <div class="mark-buttons">
        <button id="unknownBtn" class="btn red">❌ ยังไม่จำ</button>
        <button id="knownBtn" class="btn green">✅ จำได้แล้ว</button>
      </div>
      <div class="nav-buttons">
        <button id="prevBtn" class="btn">◀ ก่อนหน้า</button>
        <button id="nextBtn" class="btn">ถัดไป ▶</button>
      </div>
    </section>

    <!-- ===== สถิติ ===== -->
    <section class="stats">
      <h3>สถิติการจำ</h3>
      <div id="statsList"></div>
      <p id="syncStatus" class="sync-status"></p>
    </section>
  </main>
  </div>


  <!-- Firebase (เวอร์ชัน compat ใช้ได้กับ <script> ธรรมดา ไม่ต้อง build) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <!-- ต้องโหลด words.js ก่อน app.js เพราะ app.js ใช้ข้อมูลคำศัพท์ -->
  <script src="words.js"></script>
  <script src="app.js"></script>
</body>
</html>
